name: brightquest_kids
description: BrightQuest Kids - offline-first educational adventure app for Classes 3 to 5.
publish_to: 'none'
version: 0.6.0+26

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  audioplayers: 6.7.1
  flutter_tts: 4.2.5
  url_launcher: ^6.3.2

dependency_overrides:
  audioplayers_windows:
    path: third_party/audioplayers_windows_stub
  # flutter_tts 4.2.5's native Windows DLL crashes with an access violation on
  # current Flutter/Windows. Keep its Android plugin, but do not register the
  # unsafe Windows implementation. Windows narration runs in a separate,
  # crash-isolated System.Speech helper process instead.
  flutter_tts:
    path: third_party/flutter_tts_android

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/brightquest_app_icon.png
    - assets/audio/bgm/
    - assets/audio/sfx/
    - assets/content/content_schema_v1.json
    - assets/content/curriculum_map.json
    - assets/content/current_content_audit.json
    - assets/content/class_3/pack.json
    - assets/content/class_4/pack.json
    - assets/content/class_5/pack.json
    - assets/content/class_3/learning_blueprints.json
    - assets/content/class_4/learning_blueprints.json
    - assets/content/class_5/learning_blueprints.json
    - assets/content/shared/audio_transcripts.json
    - assets/content/nursery/schema_v1.json
    - assets/content/nursery/pack_v1.json
    - assets/nursery/letter_cards/
